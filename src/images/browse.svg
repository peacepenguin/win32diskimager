<!-- Browse for an image file. An outline folder, in slate rather than a colour:
     the three action icons use colour to mean something (amber for write, blue
     for read, violet for verify) and this one is chrome, not an action. Drawn
     as a line rather than a solid so it sits beside the text field without
     shouting, and stays legible at the 16px the button gives it. -->
