<!-- Verify: weigh what is on the device against what is in the image. A pair
     of scales says "compare these two" in a way arrows could not: the earlier
     double-headed arrow read as "both directions", which is how it works
     rather than what it is for.

     The drawing is "investments-balance" from SVG Repo's Investments set,
     dedicated to the public domain under CC0, so it carries no attribution
     requirement. Recorded here because knowing where art came from matters
     later, not because anything is owed.
     https://www.svgrepo.com/svg/91373/investments-balance

     Slate, from the app icon: neither the caution of write nor the plain copy
     of read.

     The viewBox is wider than the drawing on purpose. That trailing space is
     what separates the scales from the word "Verify" on the button; padding the
     button itself would have moved the text too. -->
