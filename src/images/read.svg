<!-- Read: device -> image file. The same silhouette as write.svg, mirrored and
     drawn as an outline rather than filled: direction and weight distinguish the
     two before colour does, which matters because green and amber are the pair
     the commonest colour blindness struggles with. The bar at the bottom is the
     device in both. -->
