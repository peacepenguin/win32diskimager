<!-- Write: image file -> device. A solid arrow pointing down into the bar that
     stands for the device. Solid fill and the downward direction both carry the
     meaning, so it still reads without colour. Amber rather than red: red and
     green cannot be told apart by the most common form of colour blindness.
     This is the app icon's own amber, so the accent that means "writing"
     is the same one in the icon. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <path d="M8.5 3h7v7h5.1L12 17.6 3.4 10H8.5z" fill="#F59E0B"/>
  <rect x="3.6" y="19.4" width="16.8" height="2.6" rx="1.3" fill="#F59E0B"/>
</svg>
