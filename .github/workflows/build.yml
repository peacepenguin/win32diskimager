name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Cross-compile a win64 binary from Linux. Ubuntu has no MinGW Qt6 packages,
  # so the job runs in a Fedora container, which does ship them.
  windows-x86_64:
    runs-on: ubuntu-latest
    # Keep in step with CROSS_BASE_IMAGE in tools/build-env.sh. It cannot be
    # read from there: this is resolved before any step runs.
    container: fedora:44
    # Needed only by the release step, which creates a GitHub release.
    permissions:
      contents: write

    steps:
      # git first and on its own: actions/checkout needs it, and the toolchain
      # list it would otherwise come from is in the repository being checked out.
      - name: Install git
        run: dnf -y install git

      - uses: actions/checkout@v7

      # One list of packages and one set of toolchain paths, shared with
      # tools/Containerfile.build and the build scripts. "install ci" adds the
      # few things only this job needs (zip and gh, to publish a release), and
      # fails loudly if the toolchain is not laid out the way the build expects.
      - name: Install cross toolchain
        run: bash tools/build-env.sh install ci

      # The workspace is owned by a different UID than the user running these
      # steps, so git refuses to read the repository. Anything shelling out to
      # git -- gh, for one -- fails with "detected dubious ownership" without
      # this.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The same script a developer runs on a Fedora host, and the same one
      # tools/build-container.sh runs inside the image -- so however this is
      # built, it is built by this. It configures, builds into build/, and
      # fails if the result is not a win64 PE binary.
      - name: Build
        run: bash tools/build-cross.sh

      # Directories and sysroot all default; see tools/build-env.sh.
      - name: Package
        run: bash tools/deploy-cross.sh

      - uses: actions/upload-artifact@v7
        with:
          name: Win32DiskImager-win64
          path: dist/
          if-no-files-found: error

      # A tag that disagrees with src/CMakeLists.txt would ship a binary whose
      # own version string contradicts the release it is attached to.
      - name: Check the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^project(Win32DiskImager VERSION \([0-9.]*\).*/\1/p' src/CMakeLists.txt)
          echo "project version: $version, tag: ${GITHUB_REF_NAME}"
          test "v$version" = "${GITHUB_REF_NAME}"

      - name: Build the release zip
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          name="Win32DiskImager-${GITHUB_REF_NAME}-win64"
          mv dist "$name"
          zip -qr "$name.zip" "$name"
          sha256sum "$name.zip" > "$name.zip.sha256"
          cat "$name.zip.sha256"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name="Win32DiskImager-${GITHUB_REF_NAME}-win64"
          cat > notes.md <<'EOF'
          Standalone win64 build.
          Unzip and run `Win32DiskImager.exe` as Administrator.

          Verify the download against the published `.sha256` before running it.

          See `Changelog.txt` in the zip for what changed.
          EOF
          # --repo makes gh resolve the target over the API rather than by
          # inspecting the local git remote.
          gh release create "${GITHUB_REF_NAME}" \
            "$name.zip" "$name.zip.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
