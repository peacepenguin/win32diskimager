name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Cross-compile a win64 binary from Linux. Ubuntu has no MinGW Qt6 packages,
  # so the job runs in a Fedora container, which does ship them.
  windows-x86_64:
    runs-on: ubuntu-latest
    container: fedora:44
    # Needed only by the release step, which creates a GitHub release.
    permissions:
      contents: write

    steps:
      - name: Install cross toolchain
        run: |
          dnf -y install \
            git cmake ninja-build file findutils binutils zip gh \
            mingw64-gcc-c++ mingw64-qt6-qtbase mingw64-qt6-qttools \
            mingw64-qt6-qttranslations \
            mingw64-zlib mingw64-xz \
            qt6-linguist
          # Fail early and loudly if the layout is not what deploy-cross.sh expects.
          test -f /usr/share/mingw/toolchain-mingw64.cmake
          test -x /usr/bin/lrelease-qt6

      - uses: actions/checkout@v7

      # The workspace is owned by a different UID than the user running these
      # steps, so git refuses to read the repository. Anything shelling out to
      # git -- gh, for one -- fails with "detected dubious ownership" without
      # this.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure
        run: |
          cmake -S src -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=/usr/share/mingw/toolchain-mingw64.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DLRELEASE_EXECUTABLE=/usr/bin/lrelease-qt6

      - name: Build
        run: cmake --build build

      - name: Verify it is a PE binary
        run: file build/Win32DiskImager.exe | grep -q 'PE32+'

      - name: Package
        run: |
          bash tools/deploy-cross.sh build dist \
            /usr/x86_64-w64-mingw32/sys-root/mingw

      - uses: actions/upload-artifact@v7
        with:
          name: Win32DiskImager-win64
          path: dist/
          if-no-files-found: error

      # A tag that disagrees with src/CMakeLists.txt would ship a binary whose
      # own version string contradicts the release it is attached to.
      - name: Check the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^project(Win32DiskImager VERSION \([0-9.]*\).*/\1/p' src/CMakeLists.txt)
          echo "project version: $version, tag: ${GITHUB_REF_NAME}"
          test "v$version" = "${GITHUB_REF_NAME}"

      - name: Build the release zip
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          name="Win32DiskImager-${GITHUB_REF_NAME}-win64"
          mv dist "$name"
          zip -qr "$name.zip" "$name"
          sha256sum "$name.zip" > "$name.zip.sha256"
          cat "$name.zip.sha256"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name="Win32DiskImager-${GITHUB_REF_NAME}-win64"
          cat > notes.md <<'EOF'
          Standalone win64 build, cross-compiled from the tagged source by GitHub
          Actions. Unzip anywhere and run `Win32DiskImager.exe` as Administrator;
          no installer and nothing else to fetch.

          Verify the download against the published `.sha256` before running it.

          See `Changelog.txt` in the zip for what changed.
          EOF
          # --repo makes gh resolve the target over the API rather than by
          # inspecting the local git remote.
          gh release create "${GITHUB_REF_NAME}" \
            "$name.zip" "$name.zip.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
